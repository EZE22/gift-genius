# Routing rules for the web container. Plain configuration: nginx follows
# these fixed rules and decides nothing on its own.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Everything under /api goes to the back end container. "api" is that
    # container's name on the shared network. nginx looks the name up when it
    # starts, so the back end must already be running, or nginx refuses to start.
    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # The search streams its results as they happen. With buffering on,
        # nginx would hold them back until the search finished and the screen
        # would stay blank. The 300 second wait matches the model timeout.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Everything else is a file from the build. A file that does not exist is a
    # real 404. The app has no page routes, so there is no reason to send
    # unknown paths to index.html, and doing so would hide a missing file.
    # "$uri/" is needed for the home page: "/" is a folder, and trying it as a
    # folder is what makes nginx serve its index.html. Without it, "/" is a 404.
    location / {
        try_files $uri $uri/ =404;
    }
}
