# Runs the Gift Genius tests on every pull request and every push to main.
#
# Nothing here calls a model. The tests use a scripted fake model, so this
# workflow needs no API key, no secrets and no running Ollama. If a secret is
# ever needed, store it as a repository secret and never print it.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository. Giving it no more than that limits
# the damage if a step is ever compromised.
permissions:
  contents: read

# A new push to the same branch cancels the older run, so the check on screen
# always belongs to the latest commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # A hung test should fail the check, not wait for the six hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # One pinned version, so a new Python release cannot turn the check red
      # on its own. The code allows 3.10 or newer, and this run is the proof
      # that it works on 3.12.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            frontend/cli/pyproject.toml

      # Only the two Python packages and their test extras. The web front end
      # and its npm packages are not needed for these tests.
      - name: Install the packages the tests need
        run: python -m pip install -e "backend[dev]" -e "frontend/cli[dev]"

      # Each package limits collection to its own tests folder in pyproject.toml.
      # Use "python -m pytest", not "pytest", so the run uses this Python.
      - name: Back end tests
        working-directory: backend
        run: python -m pytest -q

      - name: CLI tests
        working-directory: frontend/cli
        run: python -m pytest -q

  # Runs the web front end tests. Plain code, no model: the tests use
  # jsdom, a fake browser, so no API key or running backend is needed.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # One pinned Node version, so a new Node release cannot turn the check
      # red on its own. The packages need Node 22.22 or newer (jsdom and
      # vitest refuse older versions), and "22" picks the latest 22.x.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      # "npm ci" installs exactly what package-lock.json says and fails if
      # the lock file and package.json disagree. "npm install" would not.
      - name: Install the packages the tests need
        working-directory: frontend/web
        run: npm ci

      # "vitest run" runs once and exits. Plain "vitest" would wait for changes.
      - name: Web tests
        working-directory: frontend/web
        run: npm test

      # Checks the types without building anything. The tests above do not
      # catch a type error, so without this step a wrong type can merge as
      # long as the tests still pass.
      - name: Type check
        working-directory: frontend/web
        run: npm run typecheck

  # Builds the back end image and checks that the container answers
  # /api/health. Plain code, no model: the script never calls one, so no key
  # and no Ollama are needed. It is the same script you run on your Mac.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # GitHub's Ubuntu runners already have Docker and curl installed, so no
      # setup step is needed. A failure prints the container log in this step.
      - name: Docker smoke test
        run: scripts/docker-smoke-test.sh

  # Builds the web image and the back end image, starts them together on one
  # network, and checks that nginx serves the page and forwards /api to the
  # back end. Plain code, no model: nothing here calls one, so no key and no
  # Ollama are needed. It is the same script you run on your Mac.
  docker-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # GitHub's Ubuntu runners already have Docker and curl installed.
      # A failure prints both containers' logs in this step.
      - name: Docker web smoke test
        run: scripts/docker-web-smoke-test.sh
